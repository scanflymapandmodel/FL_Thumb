name: Generate File List

on:
  push:
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate list.html
        run: |
          cat > docs/list.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Image Gallery</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 20px;
              }
              ul {
                list-style: none;
                padding: 0;
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
              }
              li {
                text-align: center;
              }
              img {
                width: 200px;
                height: auto;
                border: 1px solid #ccc;
              }
            </style>
          </head>
          <body>
            <h1>Image Gallery</h1>
            <ul>
          EOF

          find docs -maxdepth 1 -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) \
            | sort | while read file; do
                filename=$(basename "$file")
                echo "<li>\"$filename\" width=\"200\"><br>$filename</a></li>" >> docs/list.html
            done

          cat >> docs/list.html << 'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Commit updated list
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/list.html

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update image gallery"
          git push
